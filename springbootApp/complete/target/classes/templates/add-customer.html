<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm khách hàng</title>
    <head>
  
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
     <title>Hello, OOP class !</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.5/dist/bootstrap-table.min.css">

   
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.5/dist/bootstrap-table.min.js"></script>


</head>
</head>
<body>
    <h2>Thêm khách hàng mới</h2>
    <form th:action="@{/customers/add}" th:object="${customer}" method="post">
        <div class="input-group mb-3">
        <label>ID:</label>
        <input  class="form-control" type="text" th:field="*{id}" required/><br/>
        <label >Tên:</label>
        <input  class="form-control" type="text" th:field="*{name}" required/><br/>
        <label>Email:</label>
        <input   class="form-control" type="email" th:field="*{email}" required/><br/>
        <label>Số điện thoại:</label>
        <input  class="form-control" type="text" th:field="*{phoneNumber}" required/><br/>
        <button  class="btn btn-primary" type="submit">Thêm khách hàng</button>

        </div>
    </form>
    <p th:text="${message}"></p>
    <a th:href="@{/customers}">Quay lại danh sách khách hàng</a>
</body>
</html>
