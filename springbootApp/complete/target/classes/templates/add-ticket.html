<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thêm vé mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-primary mt-5">
                    <div class="card-body p-4">
                        <h2 class="text-center text-primary mb-4 fw-bold">Thêm vé mới</h2>
                        <form th:action="@{/tickets/add}" th:object="${ticket}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="id" class="form-label fw-semibold text-primary">ID vé:</label>
                                    <input type="text" class="form-control" th:field="*{id}" id="id" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="movieId" class="form-label fw-semibold text-primary">ID phim:</label>
                                    <input type="text" class="form-control" th:field="*{movie.id}" id="movieId" required/>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="movieName" class="form-label fw-semibold text-primary">Tên phim:</label>
                                <input type="text" class="form-control" th:field="*{movie.name}" id="movieName" required/>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="showTime" class="form-label fw-semibold text-primary">Ngày chiếu:</label>
                                    <input type="text" class="form-control" th:field="*{movie.showTime}" id="showTime" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateTime" class="form-label fw-semibold text-primary">Giờ chiếu:</label>
                                    <input type="text" class="form-control" th:field="*{movie.dateTime}" id="dateTime" required/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="age" class="form-label fw-semibold text-primary">Độ tuổi:</label>
                                    <input type="number" class="form-control" th:field="*{movie.age}" id="age" required/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="seat" class="form-label fw-semibold text-primary">Số ghế:</label>
                                    <input type="text" class="form-control" th:field="*{seat}" id="seat" required/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="price" class="form-label fw-semibold text-primary">Giá vé:</label>
                                    <input type="number" class="form-control" th:field="*{price}" step="0.01" id="price" required/>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Thêm vé</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p class="text-primary" th:text="${message}"></p>
                        </div>
                        <div class="text-center mt-3">
                            <a class="btn btn-outline-primary fw-semibold" th:href="@{/tickets}">Quay lại danh sách vé</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
