<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm vé mới</title>
</head>
<body>
    <h2>Thêm vé mới</h2>
    <form th:action="@{/tickets/add}" th:object="${ticket}" method="post">
        <label>ID vé:</label>
        <input type="text" th:field="*{id}" required/><br/>
        <label>ID phim:</label>
        <input type="text" th:field="*{movie.id}" required/><br/>
        <label>Số ghế:</label>
        <input type="text" th:field="*{seat}" required/><br/>
        <label>Giá vé:</label>
        <input type="number" th:field="*{price}" required/><br/>
        <button type="submit">Thêm vé</button>
    </form>
    <p th:text="${message}"></p>
    <a th:href="@{/tickets}">Quay lại danh sách vé</a>
</body>
</html>
