<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa khách hàng</title>
</head>
<body>
    <h2>Sửa thông tin khách hàng</h2>
    <form th:action="@{/customers/edit/{id}(id=${id})}" th:object="${customer}" method="post">
        <label>ID:</label>
        <input type="text" th:field="*{id}" readonly/><br/>
        <label>Tên:</label>
        <input type="text" th:field="*{name}" required/><br/>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/><br/>
        <label>Số điện thoại:</label>
        <input type="text" th:field="*{phoneNumber}" required/><br/>
        <button type="submit">Cập nhật</button>
    </form>
    <p th:text="${message}"></p>
    <a th:href="@{/customers}">Quay lại danh sách khách hàng</a>
    <a th:href="@{/customers/add}">Thêm khách hàng mới</a>

</body>
</html>
