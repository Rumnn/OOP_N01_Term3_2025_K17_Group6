<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa vé</title>
</head>
<body>
    <h2>Sửa vé</h2>
    <form th:action="@{/tickets/edit/{id}(id=${ticket.id})}" th:object="${ticket}" method="post">
        <label>ID vé:</label>
        <input type="text" th:field="*{id}" readonly/><br/>
        <label>ID phim:</label>
        <input type="text" th:field="*{movie.id}" required/><br/>
        <label>Số ghế:</label>
        <input type="text" th:field="*{seat}" required/><br/>
        <label>Giá vé:</label>
        <input type="number" th:field="*{price}" required/><br/>
        <button type="submit">Cập nhật</button>
    </form>
    <p th:text="${message}"></p>
    <a th:href="@{/tickets}">Quay lại danh sách vé</a>
    <a th:href="@{/tickets/add}">Thêm vé mới</a>
</body>
</html>
