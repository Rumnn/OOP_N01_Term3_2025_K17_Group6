<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa vé</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 400px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid var(--primary-border-subtle);
        }
        h2 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            color: var(--primary-text-emphasis);
            font-weight: 600;
        }
        form input[type="text"],
        form input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid var(--primary-border-subtle);
            border-radius: 5px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background: var(--main-primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: #084298;
        }
        .message {
            text-align: center;
            color: var(--main-primary);
            margin-top: 12px;
            min-height: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--main-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .actions {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sửa vé</h2>
        <form th:action="@{/tickets/edit/{id}(id=${ticket.id})}" th:object="${ticket}" method="post">
            <label>ID vé:</label>
            <input type="text" th:field="*{id}" readonly/>
            <label>ID phim:</label>
            <input type="text" th:field="*{movie.id}" required/>
            <label>Số ghế:</label>
            <input type="text" th:field="*{seat}" required/>
            <label>Giá vé:</label>
            <input type="number" th:field="*{price}" required/>
            <button type="submit">Cập nhật</button>
        </form>
        <div class="message">
            <p th:text="${message}"></p>
        </div>
        <div class="actions">
            <a class="back-link" th:href="@{/tickets}">Quay lại danh sách vé</a>
            <a class="back-link" th:href="@{/tickets/add}">Thêm vé mới</a>
        </div>
    </div>
</body>
</html>
