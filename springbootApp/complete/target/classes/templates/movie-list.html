<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách phim</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 32px 28px 24px 28px;
            border: 2px solid var(--primary-border-subtle);
        }
        h1 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
            font-family: inherit;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            background: var(--primary-bg-subtle);
            border-radius: 8px;
            overflow: hidden;
            font-size: 1rem;
        }
        th, td {
            border: 1px solid var(--primary-border-subtle);
            padding: 10px 8px;
            text-align: center;
            font-family: inherit;
        }
        th {
            background: var(--main-primary);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr:nth-child(even) {
            background: #fff;
        }
        tr:nth-child(odd) {
            background: var(--primary-bg-subtle);
        }
        a, .action-link {
            display: inline-block;
            margin: 8px 8px 0 0;
            padding: 8px 18px;
            background: var(--main-primary);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            border: 2px solid var(--primary-border-subtle);
            font-family: inherit;
        }
        a:hover, .action-link:hover {
            background: #fff;
            color: var(--main-primary);
        }
        .actions {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Danh sách phim</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Tên phim</th>
                <th>Tiêu đề</th>
                <th>Ngày chiếu</th>
                <th>Giờ chiếu</th>
                <th>Thời lượng</th>
                <th>Thể loại</th>
                <th>Độ tuổi</th>
            </tr>
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.id}"></td>
                <td th:text="${movie.name}"></td>
                <td th:text="${movie.title}"></td>
                <td th:text="${movie.showTime}"></td>
                <td th:text="${movie.dateTime}"></td>
                <td th:text="${movie.duration}"></td>
                <td th:text="${movie.genre}"></td>
                <td th:text="${movie.age}"></td>
            </tr>
        </table>
        <div class="actions">
            <a href="/movies/add" class="action-link">Thêm phim mới</a>
            <a th:href="@{/tickets}" class="action-link">Xem danh sách vé</a>
            <a href="/customers" class="action-link">Quay lại danh sách khách hàng</a>
        </div>
    </div>
</body>
</html>
