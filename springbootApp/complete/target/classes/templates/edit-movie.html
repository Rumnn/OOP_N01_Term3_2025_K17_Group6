<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sửa phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-primary mt-5">
                    <div class="card-body p-4">
                        <h2 class="text-center text-primary mb-4 fw-bold">Sửa thông tin phim</h2>
                        <form th:action="@{/movies/edit/{id}(id=${movie.id})}" th:object="${movie}" method="post">
                            <div class="mb-3">
                                <label for="id" class="form-label fw-semibold text-primary">ID phim:</label>
                                <input type="text" class="form-control" th:value="${movie.id}" id="id" readonly/>
                                <input type="hidden" name="id" th:value="${movie.id}"/>
                                <input type="hidden" name="originalId" th:value="${movie.originalId}"/>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label fw-semibold text-primary">Tên phim:</label>
                                    <input type="text" class="form-control" th:field="*{name}" id="name" required minlength="1" maxlength="100"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="title" class="form-label fw-semibold text-primary">Tiêu đề:</label>
                                    <input type="text" class="form-control" th:field="*{title}" id="title" required minlength="1" maxlength="100"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="showTime" class="form-label fw-semibold text-primary">Ngày chiếu:</label>
                                    <input type="text" class="form-control" th:field="*{showTime}" id="showTime" required minlength="1" maxlength="50"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateTime" class="form-label fw-semibold text-primary">Giờ chiếu:</label>
                                    <input type="text" class="form-control" th:field="*{dateTime}" id="dateTime" required minlength="1" maxlength="50"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="duration" class="form-label fw-semibold text-primary">Thời lượng:</label>
                                    <input type="number" class="form-control" th:field="*{duration}" id="duration" required min="1" max="999"/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="genre" class="form-label fw-semibold text-primary">Thể loại:</label>
                                    <input type="text" class="form-control" th:field="*{genre}" id="genre" required minlength="1" maxlength="50"/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="age" class="form-label fw-semibold text-primary">Độ tuổi:</label>
                                    <input type="number" class="form-control" th:field="*{age}" id="age" required min="0" max="25"/>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Cập nhật</button>
                            </div>
                        </form>
                        <div class="text-center mb-3">
                            <p th:text="${message}" th:class="${message != null and message.startsWith('✅')} ? 'text-success fw-semibold' : 'text-danger fw-semibold'"></p>
                            <p th:text="${error}" th:if="${error != null}" class="text-danger fw-semibold"></p>
                        </div>
                        <div class="text-center mt-3">
                            <a th:href="@{/movies}" class="btn btn-outline-primary me-2">
                                <i class="bi bi-arrow-left"></i> Quay lại danh sách phim
                            </a>
                            <a th:href="@{/movies/add}" class="btn btn-outline-success">
                                <i class="bi bi-plus-circle"></i> Thêm phim mới
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
