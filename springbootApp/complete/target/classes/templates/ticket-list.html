<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Danh sách vé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm border-primary mt-4">
                    <div class="card-body p-4">
                        <h2 class="text-center text-primary mb-4 fw-bold">Danh sách vé</h2>
                        
                        <div class="table-responsive">
                            <table class="table table-striped table-hover border-primary">
                                <thead class="table-primary">
                                    <tr>
                                        <th>ID vé</th>
                                        <th>ID phim</th>
                                        <th>Số ghế</th>
                                        <th>Giá vé</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${tickets == null or tickets.empty}">
                                        <td colspan="5" class="text-center py-4 text-muted">
                                            Không có dữ liệu vé nào. 
                                            <a href="/add-test-data" class="text-primary text-decoration-underline">Thêm dữ liệu test</a>
                                        </td>
                                    </tr>
                                    <tr th:each="ticket : ${tickets}">
                                        <td th:text="${ticket.id}"></td>
                                        <td th:text="${ticket.movie.id}"></td>
                                        <td th:text="${ticket.seat}"></td>
                                        <td th:text="${ticket.price}"></td>
                                        <td>
                                            <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}" class="btn btn-sm btn-outline-primary me-2">
                                                <i class="bi bi-pencil"></i> Sửa
                                            </a>
                                            <a th:href="@{/tickets/delete/{id}(id=${ticket.id})}" class="btn btn-sm btn-outline-danger" 
                                               onclick="return confirm('Bạn có chắc muốn xóa vé này?');">
                                                <i class="bi bi-trash"></i> Xóa
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="text-center mb-3">
                            <p th:text="${message}" th:class="${message != null and message.startsWith('✅')} ? 'text-success fw-semibold' : 'text-danger fw-semibold'"></p>
                            <p th:text="${error}" th:if="${error != null}" class="text-danger fw-semibold"></p>
                        </div>
                        
                        <div class="text-center">
                            <a th:href="@{/tickets/add}" class="btn btn-primary me-2">
                                <i class="bi bi-plus-circle"></i> Thêm vé mới
                            </a>
                            <a th:href="@{/movies}" class="btn btn-outline-primary me-2">
                                <i class="bi bi-film"></i> Quay lại danh sách phim
                            </a>
                            <a th:href="@{/}" class="btn btn-outline-primary">
                                <i class="bi bi-house"></i> Trang chủ
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
