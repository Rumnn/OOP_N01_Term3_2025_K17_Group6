<!DOCTYPE HTML>
<html>
<head> 
    <title>Quản lý phim</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            background: #f7f7f7;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 80px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 36px 32px 28px 32px;
            text-align: center;
        }
        h1 {
            color: #1976d2;
            margin-bottom: 18px;
        }
        .main-link {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 32px;
            background: #1976d2;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .main-link:hover {
            background: #125ea7;
        }
        .desc {
            color: #444;
            margin-bottom: 24px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quản lý phim</h1>
        <div class="desc">Chào mừng bạn đến với hệ thống quản lý bán vé xem phim.</div>
        <a href="/movies" class="main-link">Xem phim ngay</a>
    </div>
</body>
</html>
