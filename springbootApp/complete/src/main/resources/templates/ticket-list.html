<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách vé</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 32px 28px 24px 28px;
            border: 2px solid var(--primary-border-subtle);
        }
        h2 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            background: var(--primary-bg-subtle);
            border-radius: 8px;
            overflow: hidden;
            font-size: 1rem;
        }
        th, td {
            border: 1px solid var(--primary-border-subtle);
            padding: 10px 8px;
            text-align: center;
            font-family: inherit;
        }
        th {
            background: var(--main-primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr:nth-child(even) {
            background: #fff;
        }
        tr:nth-child(odd) {
            background: var(--primary-bg-subtle);
        }
        a, .action-link {
            display: inline-block;
            margin: 4px 6px 0 0;
            padding: 7px 16px;
            background: var(--main-primary);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            border: 2px solid var(--primary-border-subtle);
            font-family: inherit;
        }
        a:hover, .action-link:hover {
            background: #fff;
            color: var(--main-primary);
        }
        .actions {
            text-align: center;
            margin-top: 18px;
        }
        .message {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Danh sách vé</h2>
        <table>
            <tr>
                <th>ID vé</th>
                <th>ID phim</th>
                <th>Số ghế</th>
                <th>Giá vé</th>
                <th>Hành động</th>
            </tr>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}"></td>
                <td th:text="${ticket.movie.id}"></td>
                <td th:text="${ticket.seat}"></td>
                <td th:text="${ticket.price}"></td>
                <td>
                    <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}" class="action-link">Sửa</a>
                    <a th:href="@{/tickets/delete/{id}(id=${ticket.id})}" class="action-link" onclick="return confirm('Bạn có chắc muốn xóa vé này?');">Xóa</a>
                </td>
            </tr>
        </table>
        <div class="message">
            <p th:text="${message}"></p>
        </div>
        <div class="actions">
            <a th:href="@{/tickets/add}" class="action-link">Thêm vé mới</a>
            <a th:href="@{/movies}" class="action-link">Quay lại danh sách phim</a>
            <a th:href="@{/}" class="action-link">Trang chủ</a>
        </div>
    </div>
</body>
</html>
