<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Danh sách phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm border-primary mt-4">
                    <div class="card-body p-4">
                        <h1 class="text-center text-primary mb-4 fw-bold">Danh sách phim</h1>
                        
                        <div class="table-responsive">
                            <table class="table table-striped table-hover border-primary">
                                <thead class="table-primary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên phim</th>
                                        <th>Tiêu đề</th>
                                        <th>Ngày chiếu</th>
                                        <th>Giờ chiếu</th>
                                        <th>Thời lượng</th>
                                        <th>Thể loại</th>
                                        <th>Độ tuổi</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${movies == null or movies.empty}">
                                        <td colspan="9" class="text-center py-4 text-muted">
                                            Không có dữ liệu phim nào. 
                                            <a href="/add-test-data" class="text-primary text-decoration-underline">Thêm dữ liệu test</a>
                                        </td>
                                    </tr>
                                    <tr th:each="movie : ${movies}">
                                        <td th:text="${movie.id}"></td>
                                        <td th:text="${movie.name}"></td>
                                        <td th:text="${movie.title}"></td>
                                        <td th:text="${movie.showTime}"></td>
                                        <td th:text="${movie.dateTime}"></td>
                                        <td th:text="${movie.duration}"></td>
                                        <td th:text="${movie.genre}"></td>
                                        <td th:text="${movie.age}"></td>
                                        <td>
                                            <a th:href="@{/movies/edit/{id}(id=${movie.id})}" class="btn btn-sm btn-outline-primary me-2">
                                                <i class="bi bi-pencil"></i> Sửa
                                            </a>
                                            <a th:href="@{/movies/delete/{id}(id=${movie.id})}" class="btn btn-sm btn-outline-danger" 
                                               onclick="return confirm('Bạn có chắc muốn xóa phim này?');">
                                                <i class="bi bi-trash"></i> Xóa
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="text-center mb-3">
                            <p th:text="${message}" th:class="${message != null and message.startsWith('✅')} ? 'text-success fw-semibold' : 'text-danger fw-semibold'"></p>
                            <p th:text="${error}" th:if="${error != null}" class="text-danger fw-semibold"></p>
                        </div>
                        
                        <div class="text-center">
                            <a href="/movies/add" class="btn btn-primary me-2">
                                <i class="bi bi-plus-circle"></i> Thêm phim mới
                            </a>
                            <a th:href="@{/tickets}" class="btn btn-outline-primary me-2">
                                <i class="bi bi-ticket"></i> Xem danh sách vé
                            </a>
                            <a href="/customers" class="btn btn-outline-primary me-2">
                                <i class="bi bi-people"></i> Quay lại danh sách khách hàng
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
