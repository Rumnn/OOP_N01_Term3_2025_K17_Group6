<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sửa khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-primary mt-5">
                    <div class="card-body p-4">
                        <h2 class="text-center text-primary mb-4 fw-bold">Sửa thông tin khách hàng</h2>
                        <form th:action="@{/customers/edit/{id}(id=${id})}" th:object="${customer}" method="post">
                            <div class="mb-3">
                                <label for="id" class="form-label fw-semibold text-primary">ID:</label>
                                <input type="text" class="form-control" th:field="*{id}" id="id" readonly/>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold text-primary">Tên:</label>
                                <input type="text" class="form-control" th:field="*{name}" id="name" required/>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold text-primary">Email:</label>
                                <input type="email" class="form-control" th:field="*{email}" id="email" required/>
                            </div>
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label fw-semibold text-primary">Số điện thoại:</label>
                                <input type="text" class="form-control" th:field="*{phoneNumber}" id="phoneNumber" required/>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Cập nhật</button>
                            </div>
                        </form>
                        <div class="text-center mb-3">
                            <p th:text="${message}" th:class="${message != null and message.startsWith('✅')} ? 'text-success fw-semibold' : 'text-danger fw-semibold'"></p>
                            <p th:text="${error}" th:if="${error != null}" class="text-danger fw-semibold"></p>
                        </div>
                        <div class="text-center mt-3">
                            <a th:href="@{/customers}" class="btn btn-outline-primary me-2">
                                <i class="bi bi-arrow-left"></i> Quay lại danh sách khách hàng
                            </a>
                            <a th:href="@{/customers/add}" class="btn btn-outline-success">
                                <i class="bi bi-plus-circle"></i> Thêm khách hàng mới
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
