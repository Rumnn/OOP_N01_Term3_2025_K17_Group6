<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thêm khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-primary mt-5">
                    <div class="card-body p-4">
                        <h2 class="text-center text-primary mb-4 fw-bold">Thêm khách hàng mới</h2>
                        <form th:action="@{/customers/add}" th:object="${customer}" method="post">
                            <div class="mb-3">
                                <label for="id" class="form-label fw-semibold text-primary">ID:</label>
                                <input type="text" class="form-control" th:field="*{id}" id="id" required/>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold text-primary">Tên:</label>
                                <input type="text" class="form-control" th:field="*{name}" id="name" required/>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold text-primary">Email:</label>
                                <input type="email" class="form-control" th:field="*{email}" id="email" required/>
                            </div>
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label fw-semibold text-primary">Số điện thoại:</label>
                                <input type="text" class="form-control" th:field="*{phoneNumber}" id="phoneNumber" required/>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Thêm khách hàng</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p class="text-primary" th:text="${message}"></p>
                        </div>
                        <div class="text-center mt-3">
                            <a class="btn btn-outline-primary fw-semibold" th:href="@{/customers}">Quay lại danh sách khách hàng</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
