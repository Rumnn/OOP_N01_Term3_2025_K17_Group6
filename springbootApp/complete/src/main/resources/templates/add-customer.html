<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm khách hàng</title>
</head>
<body>
    <h2>Thêm khách hàng mới</h2>
    <form th:action="@{/customers/add}" th:object="${customer}" method="post">
        <label>ID:</label>
        <input type="text" th:field="*{id}" required/><br/>
        <label>Tên:</label>
        <input type="text" th:field="*{name}" required/><br/>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/><br/>
        <label>Số điện thoại:</label>
        <input type="text" th:field="*{phoneNumber}" required/><br/>
        <button type="submit">Thêm khách hàng</button>
    </form>
    <p th:text="${message}"></p>
    <a th:href="@{/customers}">Quay lại danh sách khách hàng</a>
</body>
</html>
