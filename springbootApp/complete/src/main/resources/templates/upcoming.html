<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vé sắp chiếu</title>
</head>
<body>
    <h1>Danh sách vé sắp chiếu trong 1 giờ tới</h1>
    <div th:if="${error}" th:text="${error}" style="color:red"></div>
    <table border="1">
        <tr>
            <th>Tên phim</th>
            <th>Giờ chiếu</th>
            <th>Ghế</th>
        </tr>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.movieName}"></td>
            <td th:text="${ticket.showTime}"></td>
            <td th:text="${ticket.seat}"></td>
        </tr>
    </table>
</body>
</html>
