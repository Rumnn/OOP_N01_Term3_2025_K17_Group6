<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa khách hàng</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 400px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid var(--primary-border-subtle);
        }
        h2 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            color: var(--primary-text-emphasis);
            font-weight: 600;
        }
        form input[type="text"],
        form input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid var(--primary-border-subtle);
            border-radius: 5px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background: var(--main-primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: #084298;
        }
        .message {
            text-align: center;
            color: var(--main-primary);
            margin-top: 12px;
            min-height: 20px;
        }
        .actions {
            text-align: center;
            margin-top: 18px;
        }
        .action-link {
            display: inline-block;
            margin: 8px 8px 0 0;
            padding: 8px 18px;
            background: var(--main-primary);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            border: 2px solid var(--primary-border-subtle);
            font-family: inherit;
        }
        .action-link:hover {
            background: #fff;
            color: var(--main-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sửa thông tin khách hàng</h2>
        <form th:action="@{/customers/edit/{id}(id=${id})}" th:object="${customer}" method="post">
            <label>ID:</label>
            <input type="text" th:field="*{id}" readonly/>
            <label>Tên:</label>
            <input type="text" th:field="*{name}" required/>
            <label>Email:</label>
            <input type="email" th:field="*{email}" required/>
            <label>Số điện thoại:</label>
            <input type="text" th:field="*{phoneNumber}" required/>
            <button type="submit">Cập nhật</button>
        </form>
        <div class="message">
            <p th:text="${message}"></p>
        </div>
        <div class="actions">
            <a th:href="@{/customers}" class="action-link">Quay lại danh sách khách hàng</a>
            <a th:href="@{/customers/add}" class="action-link">Thêm khách hàng mới</a>
        </div>
    </div>
</body>
</html>
