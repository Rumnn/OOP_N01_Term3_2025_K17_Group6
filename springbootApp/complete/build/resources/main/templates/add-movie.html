<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm phim mới</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 420px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid var(--primary-border-subtle);
        }
        h1 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        } 
        form label {
            align-self: flex-start;
            margin-bottom: 6px;
            color: var(--primary-text-emphasis);
            font-weight: 600;
        }
        form input[type="text"],
        form input[type="number"] {
            width: 90%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid var(--primary-border-subtle);
            border-radius: 5px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button[type="submit"] {
            width: 90%;
            padding: 10px;
            background: var(--main-primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button[type="submit"]:hover {
            background: #084298;
        }
        .message {
            text-align: center;
            color: var(--main-primary);
            margin-top: 12px;
            min-height: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--main-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thêm Phim Mới</h1>
        <form th:action="@{/movies/add}" th:object="${movie}" method="post">
            <label>ID phim:</label>
            <input type="text" th:field="*{id}" required/>
            <label>Tên phim:</label>
            <input type="text" th:field="*{name}" required/>
            <label>Tiêu đề phim:</label>
            <input type="text" th:field="*{title}" required/>
            <label>Ngày chiếu:</label>
            <input type="text" th:field="*{showTime}" required/>
            <label>Giờ chiếu:</label>
            <input type="text" th:field="*{dateTime}" required/>
            <label>Thời lượng:</label>
            <input type="number" th:field="*{duration}" required/>
            <label>Thể loại:</label>
            <input type="text" th:field="*{genre}" required/>
            <label>Độ tuổi:</label>
            <input type="number" th:field="*{age}" required/>
            <button type="submit">Thêm phim</button>
        </form>
        <div class="message">
            <p th:text="${message}"></p>
        </div>
        <a class="back-link" href="/movies">Quay lại</a>
    </div>
</body>
</html>
